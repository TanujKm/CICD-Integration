name: PDLC Quality Pipeline

on:
  pull_request:
    branches: [ main, master, develop, IIntegration ]
  push:
    branches: [ main, master, IIntegration ]

env:
  JAVA_VERSION: '17'

jobs:

  # extract jira issue key from branch name, PR title, or commit message
  # order: branch -> PR title -> commit message (first match wins)
  extract-jira-key:
    runs-on: ubuntu-latest
    outputs:
      jira_key: ${{ steps.extract.outputs.jira_key }}
      key_found: ${{ steps.extract.outputs.key_found }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract Jira key
        id: extract
        env:
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          KEY=""

          # try branch name first
          KEY=$(echo "$BRANCH" | grep -oE '[A-Z]+-[0-9]+' | head -1 || true)

          # try PR title if branch had no key
          if [ -z "$KEY" ] && [ -n "$PR_TITLE" ]; then
            KEY=$(echo "$PR_TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -1 || true)
          fi

          # try commit message last
          if [ -z "$KEY" ] && [ -n "$COMMIT_MSG" ]; then
            KEY=$(echo "$COMMIT_MSG" | grep -oE '[A-Z]+-[0-9]+' | head -1 || true)
          fi

          if [ -n "$KEY" ]; then
            echo "found jira key: $KEY"
            echo "jira_key=$KEY" >> $GITHUB_OUTPUT
            echo "key_found=true" >> $GITHUB_OUTPUT
          else
            echo "warning: no jira key found in branch name, PR title, or commit message"
            echo "jira_key=" >> $GITHUB_OUTPUT
            echo "key_found=false" >> $GITHUB_OUTPUT
          fi


  # warn on PR if no jira key found — enforces naming convention
  # only runs on pull_request events, skipped on push
  check-jira-key:
    runs-on: ubuntu-latest
    needs: extract-jira-key
    if: github.event_name == 'pull_request'

    steps:
      - name: Check key present
        env:
          KEY_FOUND: ${{ needs.extract-jira-key.outputs.key_found }}
        run: |
          if [ "$KEY_FOUND" != "true" ]; then
            echo "warning: Jira key not found in branch name, PR title, or commit message"
            echo "please name your branch like: feature/QA-123-description"
            echo "or include the key in your PR title: QA-123 fix login issue"
            # warning only — not failing the pipeline
            # change exit 1 here if you want to enforce this as a hard gate
          else
            echo "Jira key found — ok"
          fi


  # Stage 1 - lint and build
  lint-and-build:
    runs-on: ubuntu-latest
    needs: extract-jira-key

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # soft gate for now, will harden later
      - name: Checkstyle
        run: mvn --batch-mode checkstyle:check
        continue-on-error: true

      - name: Compile
        run: mvn --batch-mode compile


  # Stage 2 - unit tests + coverage
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # skip selenium here, those run in stage 5
      - name: Run unit tests
        run: mvn --batch-mode test -Dtest="!*SeleniumTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: target/surefire-reports/
          retention-days: 14


  # Stage 2.5 - API integration tests using curl
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build jar
        run: mvn --batch-mode package -DskipTests

      - name: Start server on port 8080
        run: |
          JAR=$(ls target/*.jar | head -1)
          echo "starting server: $JAR"
          java -jar $JAR &
          echo "SERVER_PID=$!" >> $GITHUB_ENV
          sleep 3

      - name: Wait for server
        run: |
          for i in $(seq 1 15); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/employees | grep -q "200"; then
              echo "server ready"
              break
            fi
            sleep 1
          done

      - name: GET /api/employees should return 200
        run: |
          STATUS=$(curl -s -o /tmp/res.json -w "%{http_code}" http://localhost:8080/api/employees)
          BODY=$(cat /tmp/res.json)
          echo "status: $STATUS"
          echo "body: $BODY"
          if [ "$STATUS" != "200" ]; then echo "expected 200 got $STATUS"; exit 1; fi
          if [[ "$BODY" != \[* ]]; then echo "response is not a json array"; exit 1; fi

      - name: POST /api/employees should add employee
        run: |
          STATUS=$(curl -s -o /tmp/res.json -w "%{http_code}" \
            -X POST http://localhost:8080/api/employees \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "name=Test+User&email=test.user@example.com&department=QA&salary=50000")
          BODY=$(cat /tmp/res.json)
          echo "status: $STATUS"
          echo "body: $BODY"
          if [ "$STATUS" != "200" ]; then echo "expected 200 got $STATUS"; exit 1; fi
          if [[ "$BODY" != *"success"* ]]; then echo "expected success in response"; exit 1; fi

      - name: POST duplicate email should return 400
        run: |
          STATUS=$(curl -s -o /tmp/res.json -w "%{http_code}" \
            -X POST http://localhost:8080/api/employees \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "name=Another+User&email=test.user@example.com&department=HR&salary=40000")
          BODY=$(cat /tmp/res.json)
          echo "status: $STATUS"
          echo "body: $BODY"
          if [ "$STATUS" != "400" ]; then echo "expected 400 got $STATUS"; exit 1; fi
          if [[ "$BODY" != *"already exists"* ]]; then echo "expected duplicate message"; exit 1; fi

      - name: Stop server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi


  # Stage 3 - static analysis via SonarCloud
  static-analysis:
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Generate jacoco xml for sonar
        run: mvn --batch-mode test -Dtest="!*SeleniumTest" -Dsurefire.failIfNoSpecifiedTests=false

      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=TanujKm_CICD-Integration
            -Dsonar.organization=tanujkm
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
            -Dsonar.qualitygate.wait=true

      - name: Sonar skipped
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "SONAR_TOKEN not set, skipping sonar scan"


  # Stage 4 - dependency security scan (OWASP)
  security-scan:
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: OWASP dependency check
        run: |
          mvn --batch-mode \
            org.owasp:dependency-check-maven:9.2.0:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=dependency-check-suppressions.xml \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -DretireJsAnalyzerEnabled=false \
            -DossindexAnalyzerEnabled=false
        continue-on-error: true

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.xml
          if-no-files-found: warn
          retention-days: 14


  # Stage 5 - selenium e2e tests (headless chrome)
  e2e-tests:
    runs-on: ubuntu-latest
    needs: [ static-analysis, security-scan ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run selenium tests
        run: mvn --batch-mode verify

      - name: Upload e2e results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: target/surefire-reports/
          retention-days: 14


  # Stage 6 - deploy to staging only (jira comment/transition handled in jira-on-pass)
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [ e2e-tests, extract-jira-key ]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build jar
        run: mvn --batch-mode package -DskipTests

      # replace with real deploy command when staging server is ready
      - name: Deploy to staging
        run: |
          echo "deploying to staging..."
          ls target/*.jar

      # replace with real health check url
      - name: Smoke test
        run: echo "smoke test passed"


  # Stage 7 - auto create jira bug on pipeline failure
  # duplicate check: agar same tracking label ka open bug already hai to naya mat banao
  # link: sirf CREATE_BUG=true hone par Relates link lagao
  jira-on-failure:
    runs-on: ubuntu-latest
    needs:
      - extract-jira-key
      - lint-and-build
      - unit-tests
      - integration-tests
      - static-analysis
      - security-scan
      - e2e-tests
    if: failure()

    steps:
      - name: Check jira configured
        id: check
        env:
          TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "warning: JIRA_API_TOKEN not set - skipping jira bug creation"
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Build tracking label and title
        id: meta
        if: steps.check.outputs.configured == 'true'
        env:
          JIRA_KEY: ${{ needs.extract-jira-key.outputs.jira_key }}
          KEY_FOUND: ${{ needs.extract-jira-key.outputs.key_found }}
          BRANCH_RAW: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          RUN_NUM: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          # sanitize branch: replace anything not alphanumeric/dash/underscore with dash
          BRANCH_CLEAN=$(echo "$BRANCH_RAW" | sed 's/[^A-Za-z0-9_-]/-/g')

          # tracking label: ci-<KEY> if key found, else ci-<sanitized branch>
          if [ "$KEY_FOUND" = "true" ]; then
            TRACKING_LABEL="ci-${JIRA_KEY}"
          else
            TRACKING_LABEL="ci-${BRANCH_CLEAN}"
          fi

          # short sha (7 chars)
          SHORT_SHA="${SHA:0:7}"

          # title
          if [ "$KEY_FOUND" = "true" ]; then
            TITLE="[CI Failure] ${JIRA_KEY}: ${WORKFLOW} failed (#${RUN_NUM}, ${SHORT_SHA})"
          else
            TITLE="[CI Failure] ${BRANCH_CLEAN}: ${WORKFLOW} failed (#${RUN_NUM}, ${SHORT_SHA})"
          fi

          echo "tracking_label=$TRACKING_LABEL" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "branch_clean=$BRANCH_CLEAN" >> $GITHUB_OUTPUT

      - name: Duplicate bug check via Jira JQL
        id: dup_check
        if: steps.check.outputs.configured == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TRACKING_LABEL: ${{ steps.meta.outputs.tracking_label }}
        run: |
          JQL="labels = \"${TRACKING_LABEL}\" AND statusCategory != Done"
          PAYLOAD=$(jq -n --arg jql "$JQL" '{"jql": $jql, "maxResults": 1, "fields": ["summary","status"]}')

          HTTP_STATUS=$(curl -s -o /tmp/dup_res.json -w "%{http_code}" \
            -X POST "${JIRA_BASE_URL}/rest/api/3/search/jql" \
            -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "jql search status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "warning: duplicate check returned $HTTP_STATUS - will create new bug anyway"
            echo "create_bug=true" >> $GITHUB_OUTPUT
            echo "existing_key=" >> $GITHUB_OUTPUT
          else
            EXISTING=$(jq -r '.issues[0].key // empty' /tmp/dup_res.json)
            if [ -n "$EXISTING" ]; then
              echo "open bug already exists: $EXISTING - will comment instead of creating new"
              echo "create_bug=false" >> $GITHUB_OUTPUT
              echo "existing_key=$EXISTING" >> $GITHUB_OUTPUT
            else
              echo "no open bug found - will create new bug"
              echo "create_bug=true" >> $GITHUB_OUTPUT
              echo "existing_key=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Comment on existing bug - failed again
        if: steps.check.outputs.configured == 'true' && steps.dup_check.outputs.create_bug == 'false'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          EXISTING_KEY: ${{ steps.dup_check.outputs.existing_key }}
          RUN_NUM: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(jq -n \
            --arg run_num "$RUN_NUM" \
            --arg run_url "$RUN_URL" \
            '{
              "body": {
                "type": "doc",
                "version": 1,
                "content": [{
                  "type": "paragraph",
                  "content": [{
                    "type": "text",
                    "text": ("Failed again, run #" + $run_num + " - " + $run_url)
                  }]
                }]
              }
            }')

          HTTP=$(curl -s -o /tmp/comment_res.json -w "%{http_code}" \
            -X POST "${JIRA_BASE_URL}/rest/api/3/issue/${EXISTING_KEY}/comment" \
            -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          if [ "$HTTP" != "201" ]; then
            echo "warning: comment failed with status $HTTP"
          else
            echo "commented on existing bug $EXISTING_KEY"
          fi

      - name: Login to Jira
        if: steps.check.outputs.configured == 'true' && steps.dup_check.outputs.create_bug == 'true'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Build failed jobs list
        id: failed_jobs
        if: steps.check.outputs.configured == 'true' && steps.dup_check.outputs.create_bug == 'true'
        env:
          R_LINT: ${{ needs.lint-and-build.result }}
          R_UNIT: ${{ needs.unit-tests.result }}
          R_INTEG: ${{ needs.integration-tests.result }}
          R_STATIC: ${{ needs.static-analysis.result }}
          R_SEC: ${{ needs.security-scan.result }}
          R_E2E: ${{ needs.e2e-tests.result }}
        run: |
          FAILED=""
          [ "$R_LINT" = "failure" ] && FAILED="$FAILED lint-and-build"
          [ "$R_UNIT" = "failure" ] && FAILED="$FAILED unit-tests"
          [ "$R_INTEG" = "failure" ] && FAILED="$FAILED integration-tests"
          [ "$R_STATIC" = "failure" ] && FAILED="$FAILED static-analysis"
          [ "$R_SEC" = "failure" ] && FAILED="$FAILED security-scan"
          [ "$R_E2E" = "failure" ] && FAILED="$FAILED e2e-tests"
          FAILED=$(echo "$FAILED" | xargs)
          echo "failed_jobs=$FAILED" >> $GITHUB_OUTPUT

      - name: Create Jira bug for pipeline failure
        if: steps.check.outputs.configured == 'true' && steps.dup_check.outputs.create_bug == 'true'
        id: create-bug
        uses: atlassian/gajira-create@v3
        with:
          project: ${{ vars.JIRA_PROJECT_KEY }}
          issuetype: Bug
          summary: ${{ steps.meta.outputs.title }}
          description: |
            Pipeline failed automatically.

            Failed jobs: ${{ steps.failed_jobs.outputs.failed_jobs }}
            Branch: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
            Commit: ${{ github.sha }}
            Commit message: ${{ github.event.head_commit.message }}
            Author: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          fields: '{"labels": ["ci-failure", "automated", "${{ steps.meta.outputs.tracking_label }}"]}'

      - name: Link bug to original Jira issue via Relates
        if: steps.check.outputs.configured == 'true' && steps.dup_check.outputs.create_bug == 'true' && needs.extract-jira-key.outputs.key_found == 'true' && steps.create-bug.outputs.issue != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          NEW_ISSUE: ${{ steps.create-bug.outputs.issue }}
          PARENT_ISSUE: ${{ needs.extract-jira-key.outputs.jira_key }}
        run: |
          PAYLOAD=$(jq -n \
            --arg new_key "$NEW_ISSUE" \
            --arg parent_key "$PARENT_ISSUE" \
            '{
              "type": {"name": "Relates"},
              "inwardIssue": {"key": $new_key},
              "outwardIssue": {"key": $parent_key}
            }')

          HTTP=$(curl -s -o /tmp/link_res.json -w "%{http_code}" \
            -X POST "${JIRA_BASE_URL}/rest/api/3/issueLink" \
            -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP" != "201" ]; then
            echo "warning: issue link failed with status $HTTP - bug was still created"
          else
            echo "linked $NEW_ISSUE to $PARENT_ISSUE"
          fi

      - name: No jira key warning
        if: steps.check.outputs.configured == 'true' && needs.extract-jira-key.outputs.key_found != 'true'
        run: echo 'warning jira key not found - bug created without link to parent issue'


  # jira-on-pass: runs on all branches after e2e passes
  # 1. login + comment + transition on linked jira key
  # 2. find open tracking-label bug and comment "Fixed in build #N"
  jira-on-pass:
    runs-on: ubuntu-latest
    needs:
      - extract-jira-key
      - e2e-tests
    if: success()

    steps:
      - name: Check jira configured
        id: check
        env:
          TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Login to Jira
        if: steps.check.outputs.configured == 'true'
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Comment on linked Jira issue - pipeline passed
        if: steps.check.outputs.configured == 'true' && needs.extract-jira-key.outputs.key_found == 'true'
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          comment: |
            Pipeline passed on branch ${{ github.ref_name }}
            Build: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Transition linked Jira issue to Ready for UAT
        if: steps.check.outputs.configured == 'true' && needs.extract-jira-key.outputs.key_found == 'true'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ needs.extract-jira-key.outputs.jira_key }}
          transition: "Ready for UAT"
        continue-on-error: true

      - name: Build tracking label
        id: meta
        if: steps.check.outputs.configured == 'true'
        env:
          JIRA_KEY: ${{ needs.extract-jira-key.outputs.jira_key }}
          KEY_FOUND: ${{ needs.extract-jira-key.outputs.key_found }}
          BRANCH_RAW: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          BRANCH_CLEAN=$(echo "$BRANCH_RAW" | sed 's/[^A-Za-z0-9_-]/-/g')
          if [ "$KEY_FOUND" = "true" ]; then
            echo "tracking_label=ci-${JIRA_KEY}" >> $GITHUB_OUTPUT
          else
            echo "tracking_label=ci-${BRANCH_CLEAN}" >> $GITHUB_OUTPUT
          fi

      - name: Find open bug with tracking label
        id: find_bug
        if: steps.check.outputs.configured == 'true'
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TRACKING_LABEL: ${{ steps.meta.outputs.tracking_label }}
        run: |
          JQL="labels = \"${TRACKING_LABEL}\" AND statusCategory != Done"
          PAYLOAD=$(jq -n --arg jql "$JQL" '{"jql": $jql, "maxResults": 1, "fields": ["summary"]}')

          HTTP=$(curl -s -o /tmp/find_res.json -w "%{http_code}" \
            -X POST "${JIRA_BASE_URL}/rest/api/3/search/jql" \
            -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP" != "200" ]; then
            echo "warning: bug search returned $HTTP - skipping fixed comment"
            echo "bug_key=" >> $GITHUB_OUTPUT
          else
            BUG_KEY=$(jq -r '.issues[0].key // empty' /tmp/find_res.json)
            if [ -n "$BUG_KEY" ]; then
              echo "found open bug: $BUG_KEY"
              echo "bug_key=$BUG_KEY" >> $GITHUB_OUTPUT
            else
              echo "no open bug found for label $TRACKING_LABEL"
              echo "bug_key=" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Comment fixed on open bug
        if: steps.check.outputs.configured == 'true' && steps.find_bug.outputs.bug_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          BUG_KEY: ${{ steps.find_bug.outputs.bug_key }}
          RUN_NUM: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(jq -n \
            --arg run_num "$RUN_NUM" \
            --arg run_url "$RUN_URL" \
            '{
              "body": {
                "type": "doc",
                "version": 1,
                "content": [{
                  "type": "paragraph",
                  "content": [{
                    "type": "text",
                    "text": ("Fixed in build #" + $run_num + " - " + $run_url)
                  }]
                }]
              }
            }')

          HTTP=$(curl -s -o /tmp/fixed_res.json -w "%{http_code}" \
            -X POST "${JIRA_BASE_URL}/rest/api/3/issue/${BUG_KEY}/comment" \
            -u "${JIRA_USER_EMAIL}:${JIRA_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          if [ "$HTTP" != "201" ]; then
            echo "warning: fixed comment failed with status $HTTP"
          else
            echo "commented Fixed in build #${RUN_NUM} on $BUG_KEY"
          fi
