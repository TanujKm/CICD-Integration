<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Employee — Demo</title>
</head>
<body>
    <h1>Add New Employee</h1>

    <form id="addEmployeeForm" novalidate>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="department">Department:</label>
        <input type="text" id="department" name="department" required>
        <br><br>

        <label for="salary">Salary:</label>
        <input type="number" id="salary" name="salary" required>
        <br><br>

        <button type="submit" id="submitBtn">Add Employee</button>
    </form>

    <p id="statusMessage"></p>
    <a href="/">Back to Employee List</a>

    <script>
        document.getElementById("addEmployeeForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const params = new URLSearchParams();
            params.append("name", document.getElementById("name").value);
            params.append("email", document.getElementById("email").value);
            params.append("department", document.getElementById("department").value);
            params.append("salary", document.getElementById("salary").value);

            fetch("/api/employees", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: params.toString()
            })
                .then(response => response.json().then(data => ({ status: response.status, body: data })))
                .then(result => {
                    const statusEl = document.getElementById("statusMessage");
                    if (result.status === 200) {
                        statusEl.innerText = "Employee added successfully (ID: " + result.body.id + ")";
                    } else {
                        statusEl.innerText = "Error: " + result.body.message;
                    }
                });
        });
    </script>
</body>
</html>
